[project]
name = "rag-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opensearch-py>=3.2.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pyarrow>=26.0.0",
    "pymilvus>=3.0.2",
    "ranx>=0.3.21",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
agentic = [
    "mcp>=2.3.0",
    "scikit-learn>=1.9.1",
    "starlette>=1.9.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.54.0",
]
